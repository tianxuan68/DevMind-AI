# DevMind-AI Nginx 站点配置
# 安装路径示例：/etc/nginx/conf.d/devmind.conf

upstream devmind_backend {
    server 127.0.0.1:8004;
    keepalive 32;
}

server {
    listen 80;
    server_name 8.211.188.59;

    client_max_body_size 200m;

    # 前端静态资源（npm run build 产物）
    root /opt/devmind-ai/front/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://devmind_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass http://devmind_backend/health;
    }
}
