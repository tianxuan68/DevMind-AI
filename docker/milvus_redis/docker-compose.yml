# T11: Milvus + Redis compose 配置
# 参考：E:/study_project/Itcast_qa_system/docker/milvus_redis/docker-compose.yml
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    volumes:
      - ./volumes/etcd:/etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    volumes:
      - ./volumes/minio:/minio_data

  milvus:
    image: milvusdb/milvus:v2.3.3
    depends_on:
      - etcd
      - minio
    volumes:
      - ./volumes/milvus:/var/lib/milvus

  redis:
    image: redis:7.2-alpine
    ports:
      - "16379:6379"
    volumes:
      - ./volumes/redis:/data
