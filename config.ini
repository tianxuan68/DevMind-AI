# DevMind-AI 企业内部技术知识库智能问答系统配置
# 注意：真实密钥/密码请通过环境变量或 .env 注入，不要提交到仓库。

[mysql]
host = 127.0.0.1
user = root
password = 12345678
database = internal_tech_kb

[redis]
host = 127.0.0.1
port = 16379
password =
db = 0

[milvus]
host = 127.0.0.1
port = 19530
database_name = internal_tech_kb
collection_name = internal_tech_kb

[llm]
model = qwen-plus
# API Key 请通过环境变量 DASHSCOPE_API_KEY 注入，勿在此填写真实密钥
dashscope_api_key =
dashscope_base_url = https://dashscope.aliyuncs.com/compatible-mode/v1

[reranker]
model_name = bge-reranker-v2-m3

[embedding]
model_name = bge-m3
dim = 1024

[security]
# sso_mode: mock（token 格式 user_id:name:team:security_level）/ jwt（HS256）
sso_mode = mock
sso_token_header = Authorization
sso_secret = devmind-ai-sso-secret
default_security_level = team

[ticket]
enabled = true
external_enabled = false
external_api_url =
queue_key = ticket:queue

[retrieval]
chunk_size = 1200
chunk_overlap = 150
top_k = 5
rerank_top_k = 3
confidence_threshold = 0.75
answer_cache_ttl = 3600

[app]
port = 8003
valid_sources = ["infra", "backend", "frontend", "data", "ops"]

[logger]
log_file = logs/app.log

[sms]
enabled = true
mode = send
template = k2RVBmyzanj0ny3b
send_url = https://push.spug.cc/send/k2RVBmyzanj0ny3b
app_name = DevMind AI
number = 10
timeout = 10

[oss]
# 华北2（北京）Bucket: devmindai
# 凭证通过环境变量注入：OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET
enabled = true
region = cn-beijing
bucket = devmindai
endpoint =
prefix = devmind-ai
presign_expires_seconds = 3600
