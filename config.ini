# DevMind-AI 企业内部技术知识库智能问答系统配置
# 注意：真实密钥/密码请通过环境变量或 .env 注入，不要提交到仓库。

[postgresql]
host = 127.0.0.1
port = 15432
user = devmind
password = devmind123
database = internal_tech_kb

[redis]
host = 127.0.0.1
port = 16379
password =
db = 0

[milvus]
host = 127.0.0.1
port = 19530
database_name = internal_tech_kb
collection_name = internal_tech_kb

[storage]
endpoint = 127.0.0.1:9000
access_key = minioadmin
secret_key = minioadmin
bucket = devmind-documents
secure = false

[llm]
model = qwen-plus
dashscope_api_key =
dashscope_base_url = https://dashscope.aliyuncs.com/compatible-mode/v1

[reranker]
model_name = bge-reranker-v2-m3

[embedding]
model_name = bge-m3
dim = 1024

[security]
sso_token_header = Authorization
default_security_level = team

[retrieval]
chunk_size = 1200
chunk_overlap = 150
top_k = 5
rerank_top_k = 3
confidence_threshold = 0.75

[app]
port = 15200
valid_sources = ["infra", "backend", "frontend", "data", "ops"]

[logger]
log_file = logs/app.log
