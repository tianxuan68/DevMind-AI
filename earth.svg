<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="globe" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#7ec8f7"/>
      <stop offset="45%" stop-color="#2a7fd4"/>
      <stop offset="100%" stop-color="#0b3d91"/>
    </radialGradient>
    <radialGradient id="shine" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="200"/>
    </clipPath>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" fill="#050b1a"/>

  <!-- 星星 -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="40" cy="80" r="1.5"/><circle cx="120" cy="40" r="1"/>
    <circle cx="470" cy="90" r="1.5"/><circle cx="420" cy="40" r="1"/>
    <circle cx="60" cy="400" r="1"/><circle cx="450" cy="380" r="1.5"/>
    <circle cx="200" cy="30" r="1"/><circle cx="340" cy="480" r="1.2"/>
    <circle cx="480" cy="240" r="1"/><circle cx="20" cy="220" r="1.2"/>
  </g>

  <!-- 地球 -->
  <circle cx="256" cy="256" r="200" fill="url(#globe)" stroke="#3aa0ff" stroke-width="3"/>

  <!-- 大陆（简笔风格） -->
  <g clip-path="url(#circleClip)" fill="#3f9b4f" opacity="0.95">
    <!-- 北美洲 -->
    <path d="M160,110 Q180,95 210,105 Q240,115 250,140 Q255,165 235,185 Q210,205 185,195 Q160,185 150,160 Q142,135 160,110 Z"/>
    <!-- 南美洲 -->
    <path d="M220,235 Q240,230 250,250 Q260,275 250,310 Q240,345 220,360 Q205,370 200,350 Q195,320 205,290 Q210,260 220,235 Z"/>
    <!-- 欧洲 -->
    <path d="M285,120 Q305,110 320,125 Q330,145 320,165 Q310,180 295,175 Q280,165 278,145 Q278,130 285,120 Z"/>
    <!-- 非洲 -->
    <path d="M300,195 Q325,190 340,210 Q350,240 340,275 Q325,310 305,315 Q290,310 288,285 Q285,255 290,225 Q292,205 300,195 Z"/>
    <!-- 亚洲 -->
    <path d="M330,110 Q370,95 410,115 Q435,135 430,170 Q425,200 400,215 Q375,225 350,215 Q330,200 325,170 Q322,140 330,110 Z"/>
    <!-- 澳洲 -->
    <path d="M360,350 Q385,340 405,360 Q410,385 390,400 Q365,405 350,385 Q345,365 360,350 Z"/>
    <!-- 格陵兰/北极附近 -->
    <path d="M235,85 Q260,75 280,90 Q275,110 250,110 Q230,105 235,85 Z"/>
    <!-- 南极洲 -->
    <path d="M130,430 Q220,415 320,425 Q390,435 380,455 Q360,470 250,470 Q150,470 130,455 Q120,442 130,430 Z"/>
  </g>

  <!-- 云层 -->
  <g clip-path="url(#circleClip)" fill="#ffffff" opacity="0.25">
    <ellipse cx="150" cy="180" rx="70" ry="18" transform="rotate(-15 150 180)"/>
    <ellipse cx="300" cy="240" rx="80" ry="16" transform="rotate(10 300 240)"/>
    <ellipse cx="220" cy="330" rx="60" ry="14" transform="rotate(-5 220 330)"/>
    <ellipse cx="360" cy="160" rx="50" ry="12" transform="rotate(20 360 160)"/>
  </g>

  <!-- 高光 -->
  <circle cx="256" cy="256" r="200" fill="url(#shine)"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.15"/>

  <!-- 经纬线 -->
  <g clip-path="url(#circleClip)" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.15">
    <ellipse cx="256" cy="256" rx="200" ry="80"/>
    <ellipse cx="256" cy="256" rx="200" ry="140"/>
    <ellipse cx="256" cy="256" rx="80" ry="200"/>
    <ellipse cx="256" cy="256" rx="140" ry="200"/>
  </g>

  <text x="256" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#8ab8ff">Earth</text>
</svg>
